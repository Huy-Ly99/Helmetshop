<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giỏ hàng - HelmetHop</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>


<body>

    <!-- ========================================
         HEADER
    ======================================== -->

    <header style="
        background:#111;
        padding:18px 30px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    ">

        <a href="index.html"
           style="
                color:white;
                text-decoration:none;
                font-size:24px;
                font-weight:bold;
           ">
            HelmetHop
        </a>


        <a href="cart.html"
           style="
                color:white;
                text-decoration:none;
           ">

            🛒 Giỏ hàng

            <span id="cartCount">0</span>

        </a>

    </header>


    <!-- ========================================
         CART
    ======================================== -->

    <main class="cart-container">

        <h1 class="cart-title">
            Giỏ hàng của bạn
        </h1>

        <div id="cartContent"></div>

    </main>


    <!-- ========================================
         CHECKOUT MODAL
    ======================================== -->

    <div id="checkoutModal" class="checkout-modal">

        <div class="checkout-box">


            <!-- CLOSE -->

            <button
                class="checkout-close"
                onclick="closeCheckoutModal()">
                ×
            </button>


            <!-- TITLE -->

            <h2>
                Thông tin đặt hàng
            </h2>


            <p class="checkout-description">
                Vui lòng nhập thông tin để chúng tôi
                liên hệ xác nhận đơn hàng.
            </p>


            <!-- FORM -->

            <div class="checkout-form">


                <!-- NAME -->

                <div class="form-group">

                    <label for="customerName">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Nhập họ và tên"
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="customerPhone">
                        Số điện thoại
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="Nhập số điện thoại"
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="customerAddress">
                        Địa chỉ giao hàng
                        (Địa chỉ, đường, phường, thành phố)
                    </label>

                    <textarea
                        id="customerAddress"
                        placeholder="Nhập địa chỉ giao hàng"
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <!-- CONFIRM -->

            <button
                class="confirm-order-btn"
                onclick="submitOrder()">

                Xác nhận đặt hàng

            </button>

        </div>

    </div>

    <!-- SUCCESS MODAL -->
<div id="successModal" class="success-modal">

    <div class="success-modal-content">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Đặt hàng thành công!
        </h2>

        <p>
            Cảm ơn bạn đã mua hàng.
        </p>

        <p>
            Nhân viên HelmetHop sẽ liên hệ với bạn
            để xác nhận đơn hàng.
        </p>

        <p id="successOrderId"></p>

        <button onclick="goHomeAfterOrder()">
            VỀ TRANG CHỦ
        </button>

    </div>

</div>

    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="js/cart.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
