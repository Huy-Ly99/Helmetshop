<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thông tin đặt hàng - HelmetHop</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    
<style>

    /* =========================
       POPUP ĐẶT HÀNG THÀNH CÔNG
    ========================= */

    .success-modal {

        position: fixed;

        inset: 0;

        background:
            rgba(0, 0, 0, 0.55);

        display: none;

        align-items: center;

        justify-content: center;

        z-index: 99999;

        padding: 20px;
    }


    .success-modal.show {

        display: flex;

    }


    .success-modal-content {

        width: 100%;

        max-width: 400px;

        background: white;

        border-radius: 16px;

        padding: 30px 24px;

        text-align: center;

        box-shadow:
            0 10px 30px
            rgba(0, 0, 0, 0.2);

        animation:
            successPopup
            0.25s ease;
    }


    .success-icon {

        width: 65px;

        height: 65px;

        margin:
            0 auto 15px;

        border-radius: 50%;

        background: #28a745;

        color: white;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 38px;

        font-weight: bold;
    }


    .success-modal-content h2 {

        margin:
            10px 0;

        font-size: 24px;

    }


    .success-modal-content p {

        margin:
            8px 0;

        color: #666;

        line-height: 1.5;

    }


    .success-modal-content button {

        width: 100%;

        margin-top: 20px;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #111;

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;
    }


    @keyframes successPopup {

        from {

            opacity: 0;

            transform:
                scale(0.9);

        }

        to {

            opacity: 1;

            transform:
                scale(1);

        }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

        .success-modal {

            padding: 16px;

        }


        .success-modal-content {

            padding:
                25px 20px;

            border-radius:
                14px;

        }


        .success-modal-content h2 {

            font-size:
                21px;

        }


        .success-modal-content p {

            font-size:
                14px;

        }

    }

</style>

</head>


<body>

    <main class="checkout-page">

        <div class="checkout-container">

            <h1>Thông tin đặt hàng</h1>

            <p class="checkout-note">
                Vui lòng nhập thông tin để chúng tôi liên hệ xác nhận đơn hàng.
            </p>


            <form id="checkoutForm">


                <!-- HỌ TÊN -->

                <div class="form-group">

                    <label for="customerName">
                        Họ và tên
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        name="customerName"
                        placeholder="Nhập họ và tên"
                        required
                    >

                </div>


                <!-- SỐ ĐIỆN THOẠI -->

                <div class="form-group">

                    <label for="phone">
                        Số điện thoại
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Nhập số điện thoại"
                        required
                    >

                </div>


                <!-- ĐỊA CHỈ -->

                <div class="form-group">

                    <label for="address">
                        Địa chỉ nhận hàng
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Nhập địa chỉ nhận hàng"
                        required
                    ></textarea>

                </div>


                <!-- NÚT -->

                <div class="checkout-actions">

                    <a
                        href="cart.html"
                        class="back-cart-btn"
                    >
                        ← Quay lại giỏ hàng
                    </a>


                    <button
                        type="submit"
                        class="confirm-order-btn"
                    >
                        Xác nhận đặt hàng
                    </button>

                </div>


            </form>

        </div>

    </main>


<script>

    // =========================
    // API
    // =========================

    const API_URL =
        "https://helmetshop-api.onrender.com";


    document
        .getElementById("checkoutForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const customerName =
                document
                    .getElementById("customerName")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const address =
                document
                    .getElementById("address")
                    .value
                    .trim();


            // =========================
            // KIỂM TRA THÔNG TIN
            // =========================

            if (!customerName || !phone || !address) {

                alert(
                    "Vui lòng nhập đầy đủ thông tin."
                );

                return;
            }


            // =========================
            // LẤY CART TOKEN
            // =========================

            const cartToken =
                localStorage.getItem(
                    "helmetHopCartToken"
                );


            if (!cartToken) {

                alert(
                    "Giỏ hàng không tồn tại."
                );

                return;
            }


            try {

                // =========================
                // GỬI ĐƠN HÀNG
                // =========================

                const response =
                    await fetch(
                        `${API_URL}/api/orders`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                customerName:
                                    customerName,

                                phone:
                                    phone,

                                address:
                                    address,

                                cartToken:
                                    cartToken

                            })
                        }
                    );


                const data =
                    await response.json();


                // =========================
                // ĐẶT HÀNG THẤT BẠI
                // =========================

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Đặt hàng thất bại."
                    );

                }


                // =========================
                // ĐẶT HÀNG THÀNH CÔNG
                // =========================

                console.log(
                    "Đặt hàng thành công:",
                    data
                );


                // Xóa cart token cũ
                localStorage.removeItem(
                    "helmetHopCartToken"
                );


                // Hiện popup
                showSuccessModal();


            } catch (error) {

                console.error(
                    "Order error:",
                    error
                );


                alert(
                    error.message ||
                    "Có lỗi xảy ra khi đặt hàng."
                );

            }

        });


    // =========================
    // HIỆN POPUP
    // =========================

    function showSuccessModal() {

        const modal =
            document.getElementById(
                "successModal"
            );


        if (modal) {

            modal.classList.add("show");

        }

    }


    // =========================
    // VỀ TRANG CHỦ
    // =========================

    function goHomeAfterOrder() {

        window.location.href =
            "index.html";

    }

</script>


    

<!-- POPUP ĐẶT HÀNG THÀNH CÔNG -->
<div id="successModal" class="success-modal">

    <div class="success-modal-content">

        <div class="success-icon">
            ✓
        </div>

        <h2>Đặt hàng thành công!</h2>

        <p>
            Cảm ơn bạn đã mua hàng.
        </p>

        <p>
            Nhân viên HelmetShop sẽ liên hệ với bạn
            để xác nhận đơn hàng.
        </p>

        <button onclick="goHomeAfterOrder()">
            VỀ TRANG CHỦ
        </button>

    </div>

</div>


</body>

</html>
