<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chi tiết sản phẩm - HelmetHop</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .product-detail {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .detail-image {
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 12px;
            overflow: hidden;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .detail-info {
            padding-top: 20px;
        }

        .detail-category {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .detail-name {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .detail-price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .detail-description {
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

        .detail-stock {
            margin-bottom: 25px;
            font-weight: 500;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quantity-box button {
            width: 35px;
            height: 35px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            font-size: 20px;
        }

        .quantity-box span {
            min-width: 30px;
            text-align: center;
            font-size: 18px;
        }

        .detail-add-cart {
            width: 100%;
            padding: 15px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            margin: 100px auto;
            font-size: 20px;
        }

        .error {
            text-align: center;
            margin: 100px auto;
            color: red;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 30px;
                margin-top: 30px;
            }

            .detail-image {
                height: 350px;
            }

            .detail-name {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div id="loading" class="loading">
        Đang tải sản phẩm...
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <main id="productDetail"
          class="product-detail"
          style="display: none;">

        <div class="detail-image">
            <img id="productImage" src="" alt="">
        </div>

        <div class="detail-info">

            <p id="productCategory"
               class="detail-category"></p>

            <h1 id="productName"
                class="detail-name"></h1>

            <div id="productPrice"
                 class="detail-price"></div>

            <p id="productDescription"
               class="detail-description"></p>

            <div id="productStock"
                 class="detail-stock"></div>

            <div class="quantity-box">
                <button onclick="decreaseQuantity()">−</button>

                <span id="quantity">1</span>

                <button onclick="increaseQuantity()">+</button>
            </div>

            <button
                class="detail-add-cart"
                onclick="addProductToCart()">
                THÊM VÀO GIỎ
            </button>

        </div>

    </main>

    <script>

        const API_URL =
            "https://helmetshop-986y.onrender.com";

        let product = null;
        let quantity = 1;

        // =========================
        // LẤY ID SẢN PHẨM TỪ URL
        // =========================

        const urlParams =
            new URLSearchParams(window.location.search);

        const productId =
            urlParams.get("id");


        // =========================
        // LOAD PRODUCT
        // =========================

        async function loadProduct() {

            if (!productId) {

                showError(
                    "Không tìm thấy ID sản phẩm."
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        `${API_URL}/api/products/${productId}`
                    );

                if (!response.ok) {

                    throw new Error(
                        "Không tìm thấy sản phẩm."
                    );
                }

                product =
                    await response.json();

                displayProduct();

            } catch (error) {

                console.error(error);

                showError(
                    "Không thể tải thông tin sản phẩm."
                );
            }
        }


        // =========================
        // HIỂN THỊ PRODUCT
        // =========================

        function displayProduct() {

            document.getElementById("loading")
                .style.display = "none";

            document.getElementById("productDetail")
                .style.display = "grid";


            document.getElementById("productName")
                .textContent = product.name;


            document.getElementById("productCategory")
                .textContent = product.category || "";


            document.getElementById("productPrice")
                .textContent =
                Number(product.price)
                    .toLocaleString("vi-VN") + "đ";


            document.getElementById("productDescription")
                .textContent =
                product.description ||
                "Chưa có mô tả sản phẩm.";


            document.getElementById("productStock")
                .textContent =
                `Còn ${product.stock} sản phẩm`;


            const image =
                document.getElementById("productImage");

            if (product.image) {

                image.src = product.image;

            } else {

                image.style.display = "none";

                document.querySelector(".detail-image")
                    .textContent =
                    "Chưa có hình ảnh";
            }

            updateQuantity();
        }


        // =========================
        // QUANTITY
        // =========================

        function increaseQuantity() {

            if (!product) return;

            if (quantity < product.stock) {

                quantity++;

                updateQuantity();

            }
        }


        function decreaseQuantity() {

            if (quantity > 1) {

                quantity--;

                updateQuantity();

            }
        }


        function updateQuantity() {

            document.getElementById("quantity")
                .textContent = quantity;

        }


        // =========================
        // ADD CART
        // =========================

        function addProductToCart() {

            console.log(
                "Product:",
                product
            );

            console.log(
                "Quantity:",
                quantity
            );

            alert(
                `Đã chọn ${quantity} sản phẩm!`
            );

        }


        // =========================
        // ERROR
        // =========================

        function showError(message) {

            document.getElementById("loading")
                .style.display = "none";

            const error =
                document.getElementById("error");

            error.textContent = message;

            error.style.display = "block";
        }


        // =========================
        // START
        // =========================

        loadProduct();

    </script>

</body>
</html>
