<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - HelmetShop</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- LOGO -->
            <div class="logo">
                <span>🪖</span>
                Helmet<span>Shop</span>
            </div>

            <p class="admin-title">
                ADMIN PANEL
            </p>


            <!-- LOGIN BOX -->
            <div class="login-box">

                <h1>
                    Đăng nhập
                </h1>

                <p class="login-description">
                    Đăng nhập vào trang quản trị
                </p>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Nhập email admin"
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Nhập mật khẩu"
                        >

                        <button
                            type="button"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->
                <div class="login-options">

                    <label>
                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Ghi nhớ đăng nhập
                    </label>

                </div>


                <!-- ERROR -->
                <p
                    id="errorMessage"
                    class="error-message"
                ></p>


                <!-- LOGIN BUTTON -->
                <button
                    class="login-button"
                    onclick="adminLogin()"
                >
                    ĐĂNG NHẬP
                </button>


                <!-- BACK HOME -->
                <a
                    href="../index.html"
                    class="back-home"
                >
                    ← Quay lại trang chủ
                </a>

            </div>


            <p class="copyright">
                © 2026 HelmetShop
            </p>

        </div>

    </div>


    <script src="../js/admin.js"></script>

</body>

</html>
